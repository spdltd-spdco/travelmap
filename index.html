<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1c2333">
<title>TravelMap</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/icon.svg">
<style>
  :root{
    --bg:#f6f7f9; --panel:#ffffff; --ink:#1c2333; --muted:#6b7280;
    --line:#e3e6eb; --accent:#2b6cff; --danger:#d64545;
    --sheet-h:46vh;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg);overflow:hidden}

  #map{position:fixed;inset:0}

  /* top search bar */
  #bar{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;gap:8px;padding:10px;padding-top:calc(10px + env(safe-area-inset-top));
       background:linear-gradient(#f6f7f9ee,#f6f7f900);pointer-events:none}
  #bar > *{pointer-events:auto}
  #search{flex:1;min-width:0;max-width:560px;margin:0 auto;padding:11px 13px;border:1px solid var(--line);border-radius:12px;font:inherit;
          background:var(--panel);box-shadow:0 2px 12px rgba(20,24,35,.12)}
  .iconbtn{width:42px;height:42px;flex:none;border:1px solid var(--line);background:var(--panel);border-radius:12px;cursor:pointer;
           font-size:17px;box-shadow:0 2px 12px rgba(20,24,35,.12);display:grid;place-items:center}
  .iconbtn:active{transform:scale(.94)}

  /* info / relationship panel */
  #panel{position:fixed;z-index:6;background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
  #panel.hidden{display:none}
  #panel-head{display:flex;align-items:flex-start;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
  #panel-title{font-weight:700;font-size:15px;flex:1;min-width:0}
  #panel-sub{color:var(--muted);font-size:12px;margin-top:2px}
  #panel-body{padding:12px 14px;overflow:auto;display:flex;flex-direction:column;gap:12px}
  #panel .close{border:none;background:#eef1f6;cursor:pointer;border-radius:8px;width:28px;height:28px;font-size:15px;flex:none}
  .rel{display:flex;flex-direction:column;gap:6px}
  .rel h4{margin:0;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
  .chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:#eef1f6;font-weight:600;font-size:13px;align-self:flex-start}
  .near{display:flex;flex-direction:column;gap:2px}
  .near button{all:unset;cursor:pointer;display:flex;justify-content:space-between;gap:10px;padding:7px 8px;border-radius:8px}
  .near button:hover{background:#f0f2f5}
  .near .d{color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
  .actions{display:flex;gap:8px;flex-wrap:wrap}
  .btn{padding:9px 12px;border:1px solid var(--line);background:var(--panel);border-radius:10px;cursor:pointer;font:inherit;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn:active{transform:scale(.97)}

  /* legend */
  #legend{position:fixed;z-index:4;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;
          box-shadow:0 2px 12px rgba(20,24,35,.12);font-size:12px;max-width:52vw}
  #legend .row{display:flex;align-items:center;gap:7px;padding:2px 0}
  #legend .dot{width:11px;height:11px;border-radius:50%;border:2px solid #fff;flex:none;box-shadow:0 0 0 1px rgba(0,0,0,.15)}
  #legend .updated{margin-top:6px;padding-top:6px;border-top:1px solid var(--line);color:var(--muted)}
  #legend button{all:unset;color:var(--accent);cursor:pointer;font-weight:600}

  #toast{position:fixed;left:50%;transform:translateX(-50%);z-index:9;background:#1c2333;color:#fff;padding:9px 14px;border-radius:10px;
         font-size:13px;box-shadow:0 6px 24px rgba(0,0,0,.3);transition:opacity .25s;opacity:0;pointer-events:none;max-width:80vw;text-align:center}
  #toast.show{opacity:1}

  /* desktop: side panel + bottom-left legend */
  @media (min-width:721px){
    #panel{top:74px;left:12px;width:344px;max-height:calc(100vh - 96px);border-radius:14px;box-shadow:0 8px 30px rgba(20,24,35,.18)}
    #legend{left:12px;bottom:16px}
    #toast{bottom:24px}
  }
  /* mobile: bottom sheet */
  @media (max-width:720px){
    #panel{left:0;right:0;bottom:0;max-height:var(--sheet-h);border-radius:16px 16px 0 0;box-shadow:0 -6px 30px rgba(20,24,35,.22);
           padding-bottom:env(safe-area-inset-bottom)}
    #panel::before{content:"";position:absolute;top:6px;left:50%;transform:translateX(-50%);width:38px;height:4px;border-radius:2px;background:#cdd2da}
    #panel-head{padding-top:16px}
    #legend{right:10px;bottom:10px;left:auto}
    #toast{bottom:calc(12px + env(safe-area-inset-bottom))}
    #panel:not(.hidden) ~ #legend{bottom:calc(var(--sheet-h) + 10px)}
  }
</style>
</head>
<body>
<div id="map"></div>

<div id="bar">
  <input id="search" type="text" placeholder="Search a hotel, restaurant, bar…" autocomplete="off" disabled>
  <button class="iconbtn" id="locateBtn" title="Where am I">◎</button>
</div>

<div id="panel" class="hidden">
  <div id="panel-head">
    <div style="flex:1;min-width:0">
      <div id="panel-title">—</div>
      <div id="panel-sub"></div>
    </div>
    <button class="close" id="panelClose" title="Close">✕</button>
  </div>
  <div id="panel-body"></div>
</div>

<div id="legend">
  <div id="legend-cats"></div>
  <div class="updated" id="legend-updated">loading…</div>
</div>

<div id="toast"></div>

<script>
(function(){
  "use strict";

  /* ─────────────────────────────────────────────────────────────
     CONFIG
     ───────────────────────────────────────────────────────────── */
  // Paste your Google Maps API key between the quotes ("" = prompt & remember in browser).
  const HARDCODED_KEY = "";

  // Public raw URL of your data file. Leave "" to load ./data/japan.geojson from wherever
  // this page is served. Set it to fetch the data straight from GitHub so updates need
  // only a `git push` to the data repo — no redeploy of this app.
  // e.g. "https://raw.githubusercontent.com/USER/REPO/main/data/japan.geojson"
  const DATA_URL = "";

  const CATS = {
    hotel:      { color:"#4361ee", icon:"🛏️",  label:"Hotel" },
    restaurant: { color:"#e63946", icon:"🍜",  label:"Restaurant" },
    bar:        { color:"#9d4edd", icon:"🍸",  label:"Bar" },
    sight:      { color:"#2a9d8f", icon:"⛩️",  label:"Sight" },
    transit:    { color:"#f4a261", icon:"🚉",  label:"Transit" },
    other:      { color:"#6b7280", icon:"📍",  label:"Other" }
  };
  const DEFAULT_HOOD_COLOR = "#2b6cff";
  const LS_KEY = "japanmap.apiKey";

  let map, infoWindow, autocomplete, placesSvc;
  let dataBounds = null;
  let hoods = [];        // { name, color, polygon, centroid }
  let pois  = [];        // { name, category, notes, marker, position }
  let searchMarker = null, meMarker = null;

  const $ = (s)=>document.querySelector(s);
  const getKey = ()=> HARDCODED_KEY || localStorage.getItem(LS_KEY) || "";

  function toast(msg, ms){
    const t = $("#toast"); t.textContent = msg; t.classList.add("show");
    clearTimeout(toast._t); toast._t = setTimeout(()=> t.classList.remove("show"), ms||2600);
  }

  // ---------- bootstrap Google Maps ----------
  function loadGoogle(){
    const key = getKey();
    if(!key){
      const k = prompt("Google Maps API key\n\nCreate one in Google Cloud Console with Maps JavaScript API + Places API enabled, then paste it here. It is stored only in this browser.");
      if(k){ localStorage.setItem(LS_KEY, k.trim()); location.reload(); }
      return;
    }
    const s = document.createElement("script");
    s.async = true;
    s.src = "https://maps.googleapis.com/maps/api/js?key=" + encodeURIComponent(key) +
            "&libraries=places,geometry&callback=__init&loading=async";
    s.onerror = ()=> toast("Could not load Google Maps — check the API key.", 6000);
    document.head.appendChild(s);
  }
  window.gm_authFailure = function(){
    toast("Google rejected the API key (restriction / billing / APIs).", 8000);
    if(!HARDCODED_KEY){ localStorage.removeItem(LS_KEY); }
  };

  // ---------- init ----------
  window.__init = async function(){
    map = new google.maps.Map($("#map"), {
      center:{lat:35.68, lng:139.75}, zoom:11,
      mapTypeControl:false, streetViewControl:false, fullscreenControl:false,
      clickableIcons:false,
      gestureHandling:"greedy",
      controlSize: 32
    });
    infoWindow = new google.maps.InfoWindow();
    placesSvc = new google.maps.places.PlacesService(map);

    map.addListener("click", ()=> infoWindow.close());

    // search
    const input = $("#search");
    input.disabled = false;
    autocomplete = new google.maps.places.Autocomplete(input, {
      fields:["geometry","name","formatted_address"]
    });
    autocomplete.addListener("place_changed", ()=>{
      const p = autocomplete.getPlace();
      if(p && p.geometry) return dropSearch(p.geometry.location, p.name, p.formatted_address);
      // no structured pick — fall through to text query
      runTextQuery(input.value);
    });
    input.addEventListener("keydown", (e)=>{
      if(e.key === "Enter"){
        setTimeout(()=>{ if(!autocomplete.getPlace() || !autocomplete.getPlace().geometry) runTextQuery(input.value); }, 60);
      }
    });

    $("#locateBtn").addEventListener("click", locateMe);
    $("#panelClose").addEventListener("click", clearSearch);

    buildLegend();
    await loadData(true);
  };

  // ---------- data ----------
  function dataSrc(){
    const base = DATA_URL || "data/japan.geojson";
    return base + (base.indexOf("?")<0 ? "?" : "&") + "t=" + Date.now();
  }
  async function loadData(fit){
    try{
      const res = await fetch(dataSrc(), { cache:"no-store" });
      if(!res.ok) throw new Error("HTTP " + res.status);
      const gj = await res.json();
      renderData(gj, fit);
      const when = gj.updated ? new Date(gj.updated) : null;
      $("#legend-updated").innerHTML =
        (when ? "data updated " + when.toLocaleDateString(undefined,{month:"short",day:"numeric"}) + " · " : "") +
        '<button id="refreshBtn">refresh</button>';
      $("#refreshBtn").addEventListener("click", ()=>{ toast("Refreshing data…",1200); loadData(false); });
    }catch(err){
      $("#legend-updated").innerHTML = 'could not load data — <button id="refreshBtn">retry</button>';
      $("#refreshBtn").addEventListener("click", ()=> loadData(fit));
      toast("Data load failed: " + err.message, 6000);
    }
  }

  function clearRendered(){
    hoods.forEach(h=>{ h.polygon.setMap(null); if(h.label) h.label.setMap(null); });
    pois.forEach(p=> p.marker.setMap(null));
    hoods = []; pois = [];
  }

  function renderData(gj, fit){
    clearRendered();
    const b = new google.maps.LatLngBounds();
    (gj.features || []).forEach((f)=>{
      const g = f.geometry, pr = f.properties || {};
      if(!g) return;
      if(g.type === "Polygon" || g.type === "MultiPolygon"){
        const polys = g.type === "Polygon" ? [g.coordinates] : g.coordinates;
        polys.forEach((rings)=>{
          const paths = rings.map(r=> r.map(c=> ({lat:c[1], lng:c[0]})));
          const color = pr.color || DEFAULT_HOOD_COLOR;
          const polygon = new google.maps.Polygon({
            paths, map, clickable:true,
            strokeColor:color, strokeOpacity:.9, strokeWeight:2,
            fillColor:color, fillOpacity:.14, zIndex:1
          });
          const centroid = ringCentroid(paths[0]);
          polygon.addListener("click", (e)=>{
            infoWindow.setContent('<b>'+esc(pr.name||"Neighborhood")+'</b>' + (pr.notes?'<br>'+esc(pr.notes):''));
            infoWindow.setPosition(e.latLng); infoWindow.open(map);
          });
          const label = new google.maps.Marker({
            position: centroid, map, clickable:false, zIndex:2,
            icon:{ path:google.maps.SymbolPath.CIRCLE, scale:0, strokeOpacity:0, fillOpacity:0 },
            label:{ text:(pr.name||"").toUpperCase(), color:"#243049", fontSize:"11px", fontWeight:"800" }
          });
          hoods.push({ name:pr.name||"Neighborhood", color, polygon, label, centroid });
          paths[0].forEach(pt=> b.extend(pt));
        });
      } else if(g.type === "Point"){
        const pos = { lat:g.coordinates[1], lng:g.coordinates[0] };
        const cat = CATS[pr.category] ? pr.category : "other";
        const marker = new google.maps.Marker({
          position:pos, map, title:pr.name||"", zIndex:3,
          icon:{ path:google.maps.SymbolPath.CIRCLE, scale:7, fillColor:CATS[cat].color, fillOpacity:1,
                 strokeColor:"#fff", strokeWeight:2 }
        });
        const poi = { name:pr.name||"POI", category:cat, notes:pr.notes||"", marker, position:pos };
        marker.addListener("click", ()=> openPoi(poi));
        pois.push(poi);
        b.extend(pos);
      }
    });
    dataBounds = b.isEmpty() ? null : b;
    if(dataBounds && autocomplete) autocomplete.setBounds(dataBounds);
    if(fit && dataBounds) map.fitBounds(dataBounds, 40);
  }

  function openPoi(poi){
    infoWindow.setContent(
      '<div style="min-width:150px"><b>'+esc(poi.name)+'</b>'+
      '<div style="color:#6b7280;font-size:12px;margin:2px 0">'+CATS[poi.category].icon+' '+CATS[poi.category].label+'</div>'+
      (poi.notes ? '<div style="font-size:13px">'+esc(poi.notes)+'</div>' : '')+
      '<div style="margin-top:6px"><a target="_blank" rel="noopener" href="'+dirUrl(poi.position)+'">Directions ↗</a></div></div>'
    );
    infoWindow.open({ map, anchor:poi.marker });
  }

  // ---------- search result + relationship ----------
  function runTextQuery(q){
    if(!q || !q.trim()) return;
    placesSvc.findPlaceFromQuery(
      { query:q, fields:["geometry","name","formatted_address"],
        locationBias: dataBounds || undefined },
      (r, status)=>{
        if(status === google.maps.places.PlacesServiceStatus.OK && r && r[0] && r[0].geometry){
          dropSearch(r[0].geometry.location, r[0].name, r[0].formatted_address);
        } else {
          toast("No match for “"+q+"”.", 3000);
        }
      }
    );
  }

  function dropSearch(latLng, name, addr){
    if(searchMarker) searchMarker.setMap(null);
    searchMarker = new google.maps.Marker({
      position:latLng, map, animation:google.maps.Animation.DROP, zIndex:9,
      title:name || "Search result"
    });
    searchMarker.addListener("click", ()=> showPanel(latLng, name, addr));
    map.panTo(latLng);
    if(map.getZoom() < 14) map.setZoom(15);
    showPanel(latLng, name || "Search result", addr);
  }

  function clearSearch(){
    if(searchMarker){ searchMarker.setMap(null); searchMarker = null; }
    $("#panel").classList.add("hidden");
  }

  function showPanel(latLng, name, sub){
    const containing = hoods.filter(h => google.maps.geometry.poly.containsLocation(latLng, h.polygon));
    let hoodLine;
    if(containing.length){
      hoodLine = containing.map(h => '<span class="chip">📍 in '+esc(h.name)+'</span>').join(" ");
    } else if(hoods.length){
      const nearest = hoods
        .map(h => ({ h, d: google.maps.geometry.spherical.computeDistanceBetween(latLng, h.centroid) }))
        .sort((a,b)=> a.d-b.d)[0];
      hoodLine = '<span class="chip">outside mapped areas · '+fmtDist(nearest.d)+' from '+esc(nearest.h.name)+'</span>';
    } else {
      hoodLine = '<span class="chip">no neighborhoods loaded</span>';
    }

    const near = pois
      .map(p => ({ p, d: google.maps.geometry.spherical.computeDistanceBetween(latLng, p.position) }))
      .sort((a,b)=> a.d-b.d)
      .slice(0,6);

    const nearHtml = near.length ? (
      '<div class="rel"><h4>Nearest fixed points</h4><div class="near">' +
      near.map(n =>
        '<button data-lat="'+n.p.position.lat+'" data-lng="'+n.p.position.lng+'">'+
        '<span>'+CATS[n.p.category].icon+' '+esc(n.p.name)+'</span>'+
        '<span class="d">'+fmtDist(n.d)+'</span></button>'
      ).join("") + '</div></div>'
    ) : "";

    $("#panel-title").textContent = name;
    $("#panel-sub").textContent = sub || (latLng.lat().toFixed(5)+", "+latLng.lng().toFixed(5));
    $("#panel-body").innerHTML =
      '<div class="rel"><h4>Neighborhood</h4><div>'+hoodLine+'</div></div>' +
      nearHtml +
      '<div class="actions">' +
        '<a class="btn primary" target="_blank" rel="noopener" href="'+dirUrl(latLng)+'">🧭 Directions</a>' +
        '<button class="btn" id="fitBtn">Show all</button>' +
      '</div>';

    $("#panel").classList.remove("hidden");
    $("#panel-body").querySelectorAll(".near button").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const ll = { lat:+btn.dataset.lat, lng:+btn.dataset.lng };
        map.panTo(ll); if(map.getZoom()<15) map.setZoom(16);
        const hit = pois.find(p=> p.position.lat===ll.lat && p.position.lng===ll.lng);
        if(hit) openPoi(hit);
      });
    });
    $("#fitBtn").addEventListener("click", ()=>{ if(dataBounds) map.fitBounds(dataBounds, 40); });
  }

  // ---------- my location ----------
  function locateMe(){
    if(!navigator.geolocation) return toast("Geolocation not available.", 3000);
    toast("Locating…", 1500);
    navigator.geolocation.getCurrentPosition(
      (pos)=>{
        const ll = new google.maps.LatLng(pos.coords.latitude, pos.coords.longitude);
        if(meMarker) meMarker.setMap(null);
        meMarker = new google.maps.Marker({
          position:ll, map, zIndex:8, title:"You are here",
          icon:{ path:google.maps.SymbolPath.CIRCLE, scale:8, fillColor:"#1a73e8", fillOpacity:1, strokeColor:"#fff", strokeWeight:3 }
        });
        map.panTo(ll); map.setZoom(16);
        showPanel(ll, "Your location", "");
      },
      (err)=> toast("Location error: " + err.message, 4000),
      { enableHighAccuracy:true, timeout:10000, maximumAge:30000 }
    );
  }

  // ---------- helpers ----------
  function ringCentroid(ring){
    let x=0,y=0,a=0;
    for(let i=0,n=ring.length; i<n; i++){
      const p0=ring[i], p1=ring[(i+1)%n];
      const cross = p0.lng*p1.lat - p1.lng*p0.lat;
      a += cross; x += (p0.lng+p1.lng)*cross; y += (p0.lat+p1.lat)*cross;
    }
    if(Math.abs(a) < 1e-12){ // degenerate — plain average
      const s = ring.reduce((o,p)=>({lat:o.lat+p.lat,lng:o.lng+p.lng}),{lat:0,lng:0});
      return { lat:s.lat/ring.length, lng:s.lng/ring.length };
    }
    a *= 0.5;
    return { lat: y/(6*a), lng: x/(6*a) };
  }
  function fmtDist(m){
    if(m < 950) return Math.round(m/10)*10 + " m";
    return (m/1000).toFixed(m<9500?1:0) + " km";
  }
  function dirUrl(ll){
    const lat = typeof ll.lat === "function" ? ll.lat() : ll.lat;
    const lng = typeof ll.lng === "function" ? ll.lng() : ll.lng;
    return "https://www.google.com/maps/dir/?api=1&destination=" + lat + "," + lng;
  }
  function esc(s){ return (s||"").replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

  function buildLegend(){
    $("#legend-cats").innerHTML = Object.keys(CATS).map(k=>
      '<div class="row"><span class="dot" style="background:'+CATS[k].color+'"></span>'+CATS[k].icon+' '+CATS[k].label+'</div>'
    ).join("");
  }

  loadGoogle();
})();
</script>
</body>
</html>
